<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsCommand — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- ── LOGIN SCREEN ──────────────────────────────────────────────────────── -->
  <div id="login-screen">
    <div class="login-card">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 20 20" fill="none">
            <rect x="3" y="3" width="6" height="6" rx="1" fill="currentColor"/>
            <rect x="11" y="3" width="6" height="6" rx="1" fill="currentColor" opacity="0.6"/>
            <rect x="3" y="11" width="6" height="6" rx="1" fill="currentColor" opacity="0.6"/>
            <rect x="11" y="11" width="6" height="6" rx="1" fill="currentColor"/>
          </svg>
        </div>
        <div class="logo-text">Ops<span>Command</span></div>
      </div>
      <h2>Admin Access</h2>
      <p class="login-subtitle">Enter credentials to access the control panel</p>
      <form id="login-form">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="admin">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <div id="login-error" class="error-msg" hidden></div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      <a href="/" class="back-link">← Back to Dashboard</a>
    </div>
  </div>

  <!-- ── ADMIN PANEL ────────────────────────────────────────────────────────── -->
  <div id="admin-panel" hidden>
    <div class="shell">
      <header>
        <div class="logo">
          <div class="logo-mark">
            <svg viewBox="0 0 20 20" fill="none">
              <rect x="3" y="3" width="6" height="6" rx="1" fill="currentColor"/>
              <rect x="11" y="3" width="6" height="6" rx="1" fill="currentColor" opacity="0.6"/>
              <rect x="3" y="11" width="6" height="6" rx="1" fill="currentColor" opacity="0.6"/>
              <rect x="11" y="11" width="6" height="6" rx="1" fill="currentColor"/>
            </svg>
          </div>
          <div class="logo-text">Ops<span>Command</span><span class="admin-tag">ADMIN</span></div>
        </div>
        <div class="header-actions">
          <a href="/" class="btn-secondary">View Dashboard</a>
          <button id="logout-btn" class="btn-danger">Sign Out</button>
        </div>
      </header>

      <div class="admin-grid">

        <!-- KPI Values -->
        <section class="admin-card">
          <h3>KPI Values</h3>
          <form id="kpi-form">
            <div class="form-row">
              <div class="field">
                <label>Units Produced</label>
                <input type="number" id="kpi-units" min="0">
              </div>
              <div class="field">
                <label>Machine Uptime (%)</label>
                <input type="number" id="kpi-uptime" min="0" max="100" step="0.1">
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Defect Rate (%)</label>
                <input type="number" id="kpi-defect" min="0" max="100" step="0.1">
              </div>
              <div class="field">
                <label>Inventory Alerts</label>
                <input type="number" id="kpi-inv-alerts" min="0">
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Open Work Orders</label>
                <input type="number" id="kpi-workorders" min="0">
              </div>
            </div>
            <button type="submit" class="btn-save">Save KPIs</button>
            <span class="save-status" id="kpi-status"></span>
          </form>
        </section>

        <!-- Machine Statuses -->
        <section class="admin-card">
          <h3>Machine Statuses</h3>
          <div id="machines-list"></div>
          <button id="save-machines" class="btn-save">Save Machines</button>
          <span class="save-status" id="machines-status"></span>
        </section>

        <!-- Work Orders -->
        <section class="admin-card">
          <h3>Work Orders</h3>
          <div id="workorders-list"></div>
          <button id="save-workorders" class="btn-save">Save Work Orders</button>
          <span class="save-status" id="workorders-status"></span>
        </section>

        <!-- Inventory -->
        <section class="admin-card">
          <h3>Inventory Stock Levels</h3>
          <div id="inventory-list"></div>
          <button id="save-inventory" class="btn-save">Save Inventory</button>
          <span class="save-status" id="inventory-status"></span>
        </section>

        <!-- Quality Control -->
        <section class="admin-card">
          <h3>Quality Control</h3>
          <div id="quality-list"></div>
          <button id="save-quality" class="btn-save">Save Quality</button>
          <span class="save-status" id="quality-status"></span>
        </section>

      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
